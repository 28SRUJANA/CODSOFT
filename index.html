<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix Recommendation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎬 MovieFlix</h1>

        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="Search your favorite movies..."
            >
        </div>
    </header>

    <section class="hero">
        <div class="overlay">
            <h2>Unlimited Movies, TV Shows & More</h2>
            <p>Discover movies based on your interests.</p>
        </div>
    </section>

    <section class="genres">
        <button onclick="recommend('Action')">🔥 Action</button>
        <button onclick="recommend('Comedy')">😂 Comedy</button>
        <button onclick="recommend('Sci-Fi')">🚀 Sci-Fi</button>
        <button onclick="recommend('Drama')">🎭 Drama</button>
        <button onclick="recommend('Thriller')">😱 Thriller</button>
    </section>

    <section class="title-section">
        <h2>Recommended For You</h2>
    </section>

    <div id="movieContainer"></div>

    <script src="script.js"></script>

</body>
</html>
